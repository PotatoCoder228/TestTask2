<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Rectangle Table</title>
    <style>
        html,
        body {
            margin: 0;
            padding: 20px;
        }

        table {
            border-collapse: collapse;
            border-spacing: 0;
            table-layout: fixed;
        }

        td {
            padding: 0;
        }

        .rect {
            text-align: center;
            vertical-align: middle;
            font-family: sans-serif;
            font-size: 14px;
            color: #111;
            box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.35);
        }
    </style>
</head>

<body>
    <table>
        <colgroup>
            <col style="width:40px">
            <col style="width:10px">
            <col style="width:30px">
            <col style="width:80px">
            <col style="width:40px">
            <col style="width:60px">
            <col style="width:20px">
            <col style="width:40px">
        </colgroup>

        <tr style="height:30px">
            <td></td>
            <td class="rect" colspan="3" rowspan="2" style="background-color:hsl(210, 70%, 45%)">A</td>
            <td colspan="4"></td>
        </tr>

        <tr style="height:50px">
            <td></td>
            <td></td>
            <td class="rect" rowspan="3" style="background-color:hsl(210, 70%, 74%)">B</td>
            <td colspan="2"></td>
        </tr>

        <tr style="height:10px">
            <td colspan="5"></td>
            <td colspan="2"></td>
        </tr>

        <tr style="height:20px">
            <td class="rect" colspan="2" rowspan="3" style="background-color:hsl(210, 70%, 85%)">D</td>
            <td colspan="3"></td>
            <td colspan="2"></td>
        </tr>

        <tr style="height:20px">
            <td colspan="6"></td>
        </tr>

        <tr style="height:20px">
            <td></td>
            <td class="rect" rowspan="2" style="background-color:hsl(210, 70%, 84%)">C</td>
            <td colspan="3"></td>
            <td class="rect" rowspan="3" style="background-color:hsl(210, 70%, 84%)">E</td>
        </tr>

        <tr style="height:20px">
            <td colspan="3"></td>
            <td colspan="3"></td>
        </tr>

        <tr style="height:40px">
            <td colspan="7"></td>
        </tr>
    </table>
</body>

</html>
